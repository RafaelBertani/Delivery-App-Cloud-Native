apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: delivery-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      automountServiceAccountToken: false
      containers:
        - name: order-service
          image: order-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3003
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: delivery-app-config
                  key: ORDER_SERVICE_PORT
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: delivery-app-config
                  key: NODE_ENV
            - name: RABBITMQ_HOST
              valueFrom:
                configMapKeyRef:
                  name: delivery-app-config
                  key: RABBITMQ_HOST
            - name: RABBITMQ_PORT
              valueFrom:
                configMapKeyRef:
                  name: delivery-app-config
                  key: RABBITMQ_PORT
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: delivery-app-config
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: delivery-app-config
                  key: POSTGRES_PORT
            - name: JWT_SECRET_KEY_FILE
              value: "/run/secrets/jwt_secret"
            - name: RABBITMQ_USER_FILE
              value: "/run/secrets/rabbitmq_user"
            - name: RABBITMQ_PASSWORD_FILE
              value: "/run/secrets/rabbitmq_password"
            - name: POSTGRES_USER_FILE
              value: "/run/secrets/postgres_user"
            - name: POSTGRES_PASSWORD_FILE
              value: "/run/secrets/postgres_password"
            - name: POSTGRES_DB_FILE
              value: "/run/secrets/postgres_db_delivery"
          volumeMounts:
            - name: secrets-volume
              mountPath: /run/secrets
              readOnly: true
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /api/orders/health
              port: 3003
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/orders/health
              port: 3003
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: secrets-volume
          secret:
            secretName: delivery-app-secrets

---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: delivery-app
spec:
  selector:
    app: order-service
  ports:
  - port: 3003
    targetPort: 3003
    protocol: TCP
  type: LoadBalancer