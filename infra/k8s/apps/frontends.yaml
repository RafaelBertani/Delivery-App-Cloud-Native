# ==========================================
# FRONTEND: REACT
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-react
  namespace: delivery-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend-react
  template:
    metadata:
      labels:
        app: frontend-react
    spec:
      containers:
        - name: frontend-react
          image: delivery-app/react-frontend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: frontend-react
  namespace: delivery-app
spec:
  selector:
    app: frontend-react
  ports:
  - port: 8080
    targetPort: 80
    protocol: TCP
  type: LoadBalancer

---
# ==========================================
# FRONTEND: FLUTTER
# ==========================================
apiVersion: apps/v1
